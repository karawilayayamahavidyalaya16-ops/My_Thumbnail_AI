<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vineth AI Thumbnail Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #060913;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* --- Active Fluid Water Waves Background --- */
        .water-wave {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .wave-blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            border-radius: 50%;
            animation: waterFlow 10s infinite linear;
        }

        .blob-1 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 100%);
            top: 10%;
            left: 10%;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #8a2be2 0%, #4a00e0 100%);
            bottom: 10%;
            right: 10%;
            animation-delay: -3s;
        }

        .blob-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ff007f 0%, #7928ca 100%);
            top: 50%;
            left: 50%;
            animation-delay: -6s;
        }

        @keyframes waterFlow {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(80px, -60px) scale(1.15) rotate(90deg); }
            50% { transform: translate(-60px, 80px) scale(0.9) rotate(180deg); }
            75% { transform: translate(-80px, -40px) scale(1.1) rotate(270deg); }
            100% { transform: translate(0, 0) scale(1) rotate(360deg); }
        }

        /* --- UI Glass Container --- */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 650px;
            background: rgba(13, 19, 33, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #00c6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Ad Area Notice */
        .ad-space {
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        /* Input Area */
        textarea {
            width: 100%;
            height: 100px;
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 16px;
            color: #f8fafc;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        /* Image Upload Box */
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            padding: 15px;
            background: rgba(2, 6, 23, 0.5);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .file-upload-wrapper:hover {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.05);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-upload-text {
            color: #94a3b8;
            font-size: 0.88rem;
        }

        /* --- Flowing Color Animated Button --- */
        .btn-generate {
            width: 100%;
            margin-top: 10px;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(270deg, #00c6ff, #0072ff, #7928ca, #ff007f);
            background-size: 300% 300%;
            animation: gradientFlow 5s ease infinite;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 20px rgba(0, 198, 255, 0.4);
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-generate:hover {
            box-shadow: 0 6px 30px rgba(255, 0, 127, 0.6);
            transform: translateY(-2px);
        }

        /* Loading Animation */
        .loading {
            display: none;
            margin-top: 25px;
            color: #38bdf8;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Output Box */
        .result-box {
            display: none;
            margin-top: 25px;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box img {
            width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .btn-download {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            background: #ffffff;
            color: #0b0f19;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- Water Wave Animation Background -->
    <div class="water-wave">
        <div class="wave-blob blob-1"></div>
        <div class="wave-blob blob-2"></div>
        <div class="wave-blob blob-3"></div>
    </div>

    <!-- UI Panel -->
    <div class="container">
        <h1>Vineth AI Thumbnail Studio</h1>
        <p class="subtitle">Create Ultra-HD YouTube Thumbnails Instantly</p>

        <!-- Monetization Notice -->
        <div class="ad-space">
            ✨ Powered by Adsterra Smartlink Ads
        </div>

        <textarea id="userPrompt" placeholder="Thumbnail එකට අවශ්‍ය විස්තරය ඇතුළත් කරන්න... (e.g. Cinematic gaming thumbnail, neon light effect)"></textarea>

        <!-- Image Upload Section -->
        <div class="file-upload-wrapper">
            <span class="file-upload-text" id="fileLabel">📁 Optional: Upload your photo/image for reference</span>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <button class="btn-generate" onclick="generateThumbnail()">Generate Thumbnail ✨</button>

        <div class="loading" id="loader">
            🌊 Processing Image... කරුණාකර තත්පර කිහිපයක් රැඳී සිටින්න...
        </div>

        <div class="result-box" id="resultArea">
            <img id="outputImg" src="" alt="AI Thumbnail">
            <br>
            <a href="#" id="downloadBtn" download="vineth-ai-thumbnail.png" class="btn-download">Download Image 📥</a>
        </div>
    </div>

    <script>
        document.getElementById('imageInput').addEventListener('change', function() {
            if (this.files && this.files[0]) {
                document.getElementById('fileLabel').innerText = "📸 File Selected: " + this.files[0].name;
            }
        });

        function generateThumbnail() {
            const prompt = document.getElementById('userPrompt').value;
            const loader = document.getElementById('loader');
            const resultArea = document.getElementById('resultArea');
            const outputImg = document.getElementById('outputImg');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!prompt) {
                alert("කරුණාකර Thumbnail එක සෑදීමට Text එකක් ඇතුළත් කරන්න!");
                return;
            }

            // --- ADSTERRA SMARTLINK INTEGRATION ---
            const adsterraSmartlink = "YOUR_ADSTERRA_SMARTLINK_HERE";
            
            if (adsterraSmartlink && adsterraSmartlink !== "YOUR_ADSTERRA_SMARTLINK_HERE") {
                window.open(adsterraSmartlink, '_blank');
            }

            loader.style.display = 'block';
            resultArea.style.display = 'none';

            const randomSeed = Math.floor(Math.random() * 999999);
            const formattedPrompt = encodeURIComponent("youtube thumbnail, 8k, highly detailed, " + prompt);
            const aiUrl = `https://image.pollinations.ai/prompt/${formattedPrompt}?width=1280&height=720&nologo=true&seed=${randomSeed}`;

            outputImg.src = aiUrl;
            outputImg.onload = function() {
                loader.style.display = 'none';
                resultArea.style.display = 'block';
                downloadBtn.href = aiUrl;
            };
        }
    </script>
</body>
</html>
