<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vineth AI Studio - Ultra Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ================= GLOBAL ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #020617; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 40px; overflow-x: hidden; position: relative; }

        /* ================= WELCOME SCREEN ================= */
        .welcome-screen {
            position: fixed; inset: 0; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, rgba(0,242,254,.18), rgba(121,40,202,.15), #020617 70%);
            backdrop-filter: blur(20px);
            animation: welcomeHide 0.8s ease forwards 3.5s;
        }
        .welcome-content { text-align: center; animation: welcomeIn 1.2s cubic-bezier(.17,.67,.35,1.4) forwards; }
        .welcome-logo { width: 90px; height: 90px; margin: auto auto 15px; border-radius: 25px; display: flex; align-items: center; justify-content: center; font-size: 40px; background: linear-gradient(135deg, #00f2fe, #7928ca, #ff007f); box-shadow: 0 0 20px rgba(0,242,254,.6), 0 0 50px rgba(255,0,127,.4); animation: logoPulse 2s ease-in-out infinite; }
        .welcome-title { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 800; background: linear-gradient(90deg, #00f2fe, #ffffff, #ff007f, #ffd700); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: welcomeGradient 3s linear infinite; }
        .welcome-sub { margin-top: 8px; color: #94a3b8; font-size: .9rem; letter-spacing: 2px; }

        @keyframes welcomeIn { from { opacity: 0; transform: scale(.6) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes welcomeHide { to { opacity: 0; visibility: hidden; } }
        @keyframes logoPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes welcomeGradient { 0% { background-position: 0%; } 100% { background-position: 300%; } }

        /* ================= LIQUID BACKGROUND ================= */
        .bg-liquid-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; overflow: hidden; pointer-events: none; }
        .liquid-blob { position: absolute; filter: blur(85px); opacity: .55; border-radius: 40% 60% 70% 30% / 40% 50% 60% 70%; animation: liquidFlow 12s ease-in-out infinite alternate; }
        .blob-1 { width: 450px; height: 450px; background: linear-gradient(135deg, #00f2fe, #4facfe); top: -5%; left: -5%; }
        .blob-2 { width: 500px; height: 500px; background: linear-gradient(135deg, #7928ca, #ff007f); bottom: -10%; right: -5%; }
        @keyframes liquidFlow { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-30px,50px) scale(.95); } }

        /* ================= MAIN CONTAINER ================= */
        .container { position: relative; z-index: 10; width: 90%; max-width: 600px; margin-top: 40px; }

        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(15,23,42,.85));
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 28px;
            padding: 25px;
            box-shadow: 0 25px 70px rgba(0,0,0,.75);
            margin-bottom: 20px;
        }

        h2, h3 { text-align: center; margin-bottom: 15px; font-weight: 800; }
        h2 { background: linear-gradient(135deg, #00f2fe, #ffffff, #ff007f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; }
        h3 { color: #38bdf8; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .input-label { display: block; font-size: .85rem; font-weight: 700; color: #38bdf8; margin: 12px 0 6px; }
        
        .glowing-input, .glowing-textarea {
            width: 100%; background: rgba(2,6,23,.75); border: 1px solid rgba(56,189,248,.3);
            border-radius: 14px; padding: 12px 15px; color: #fff; font-size: .95rem; outline: none; transition: .3s;
        }
        .glowing-input:focus, .glowing-textarea:focus { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0,242,254,.3); }
        .glowing-textarea { height: 80px; resize: none; }

        .btn-glow {
            width: 100%; padding: 14px; border: none; border-radius: 16px; font-size: 1rem; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, #00f2fe, #7928ca, #ff007f); cursor: pointer; transition: .3s; margin-top: 15px;
            box-shadow: 0 5px 20px rgba(0,242,254,.3);
        }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0,242,254,.6); }
        .btn-glow:active { transform: scale(.98); }

        .btn-secondary { background: rgba(51,65,85,.8); border: 1px solid rgba(255,255,255,.1); }

        /* Loader & Result */
        .loading-spinner { display: none; text-align: center; color: #00f2fe; margin-top: 15px; font-weight: 700; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }

        .result-area { display: none; margin-top: 20px; text-align: center; }
        .result-area img { width: 100%; border-radius: 18px; border: 2px solid #00f2fe; box-shadow: 0 0 25px rgba(0,242,254,.3); }
        
        .btn-download { display: inline-block; margin-top: 12px; padding: 10px 25px; background: #fff; color: #020617; text-decoration: none; border-radius: 12px; font-weight: 800; }
    </style>
</head>
<body>

    <!-- WELCOME SCREEN -->
    <div class="welcome-screen">
        <div class="welcome-content">
            <div class="welcome-logo">🎨</div>
            <div class="welcome-title">Vineth AI Studio</div>
            <div class="welcome-sub">ULTRA PRO CREATOR</div>
        </div>
    </div>

    <!-- BACKGROUND BLOBS -->
    <div class="bg-liquid-container">
        <div class="liquid-blob blob-1"></div>
        <div class="liquid-blob blob-2"></div>
    </div>

    <div class="container">
        <!-- API SETTINGS CARD -->
        <div class="glass-card">
            <h3>⚙️ API Settings</h3>
            <label class="input-label">HuggingFace Token එක මෙතන ගහන්න:</label>
            <input type="password" id="tokenInput" class="glowing-input" placeholder="hf_xxxxxxxxxxxxxxxxxxxx">
            <button onclick="saveToken()" class="btn-glow btn-secondary">Token එක Save කරන්න</button>
        </div>

        <!-- GENERATOR CARD -->
        <div class="glass-card">
            <h2>AI Thumbnail Generator</h2>
            
            <label class="input-label">Title / Main Text</label>
            <input type="text" id="titleInput" class="glowing-input" placeholder="උදා: My New Song / Gaming Stream">

            <label class="input-label">Scene Description</label>
            <textarea id="thumbInput" class="glowing-textarea" placeholder="උදා: Futuristic DJ setup, neon blue lights, cinematic lighting, 3d render"></textarea>

            <button onclick="generateFluxThumbnail()" class="btn-glow">Generate Image ⚡</button>

            <div id="loader" class="loading-spinner">✨ Generating High Quality Image...</div>

            <div id="result" class="result-area">
                <img id="outputImage" alt="AI Generated Image">
                <br>
                <a id="downloadBtn" class="btn-download" download="thumbnail.png">Download Image ⬇️</a>
            </div>
        </div>
    </div>

<script>
    // Load saved token on start
    window.onload = () => {
        const savedToken = localStorage.getItem('hf_token');
        if(savedToken) {
            document.getElementById('tokenInput').value = savedToken;
        }
    };

    function saveToken() {
        const token = document.getElementById('tokenInput').value.trim();
        if(!token) return alert("කරුණාකර valid token එකක් ඇතුළත් කරන්න!");
        localStorage.setItem('hf_token', token);
        alert("Token එක සාර්ථකව Browser එකේ Save වුණා! දැන් GitHub එකෙන් Alert එන්නේ නැහැ.");
    }

    async function generateFluxThumbnail() {
        const token = localStorage.getItem('hf_token');
        if(!token) {
            return alert("කරුණාකර උඩ තියෙන 'API Settings' එකට ගිහින් Hugging Face Token එක දාලා Save කරන්න!");
        }

        const title = document.getElementById('titleInput').value.trim();
        const scene = document.getElementById('thumbInput').value.trim();
        const loader = document.getElementById('loader');
        const result = document.getElementById('result');
        const img = document.getElementById('outputImage');
        const downloadBtn = document.getElementById('downloadBtn');

        if(!title && !scene) return alert("කරුණාකර Title එකක් හෝ Scene description එකක් ලියන්න!");

        loader.style.display = "block";
        result.style.display = "none";

        const fullPrompt = `${title} ${scene}, highly detailed, 8k resolution, cinematic lighting, 3d render, masterpiece`;

        try {
            const response = await fetch("https://router.huggingface.co/hf-inference/v1/models/black-forest-labs/FLUX.1-schnell", {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({ inputs: fullPrompt })
            });

            if(!response.ok) {
                throw new Error("API Error: Token එක වැරදියි හෝ Limit පැනලා.");
            }

            const blob = await response.blob();
            const imageUrl = URL.createObjectURL(blob);
            
            img.src = imageUrl;
            downloadBtn.href = imageUrl;

            img.onload = () => {
                loader.style.display = "none";
                result.style.display = "block";
            };

        } catch(error) {
            alert("දෝෂයක් සිදු වුණා! Token එක නිවැරදිදැයි නැවත පරීක්ෂා කරන්න.");
            loader.style.display = "none";
        }
    }
</script>
</body>
</html>
