<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vineth AI Studio - FLUX 3D Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #020617; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 12px; overflow-x: hidden; position: relative; }
        .bg-liquid-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; overflow: hidden; pointer-events: none; }
        .liquid-blob { position: absolute; filter: blur(80px); opacity: 0.6; border-radius: 50%; animation: liquidFlow 12s ease-in-out infinite alternate; }
        .blob-1 { width: 450px; height: 450px; background: linear-gradient(135deg, #00f2fe, #4facfe); top: -5%; left: -5%; }
        .blob-2 { width: 500px; height: 500px; background: linear-gradient(135deg, #7928ca, #ff007f); bottom: -10%; right: -5%; }
        @keyframes liquidFlow { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 40px) scale(1.1); } }
        .tab-menu { position: relative; z-index: 10; display: flex; gap: 12px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(25px); padding: 8px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); margin-bottom: 25px; width: 100%; max-width: 420px; }
        .tab-btn { flex: 1; padding: 14px; border: none; border-radius: 15px; background: transparent; color: #94a3b8; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; }
        .tab-btn.active { background: linear-gradient(135deg, #00f2fe, #7928ca, #ff007f); color: #ffffff; box-shadow: 0 0 20px rgba(0, 242, 254, 0.6); }
        .glass-card { position: relative; z-index: 10; display: none; width: 100%; max-width: 680px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(35px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 28px; padding: 28px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); }
        .glass-card.active { display: block; }
        h2 { font-size: 1.8rem; font-weight: 800; text-align: center; background: linear-gradient(135deg, #00f2fe, #ff007f, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .sub-text { text-align: center; color: #94a3b8; font-size: 0.88rem; margin-bottom: 20px; }
        .input-label { display: block; font-size: 0.85rem; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
        .glowing-input, .glowing-textarea { width: 100%; background: rgba(2, 6, 23, 0.85); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 16px; padding: 14px; color: #ffffff; font-size: 0.95rem; outline: none; margin-bottom: 16px; }
        .glowing-textarea { height: 90px; resize: none; }
        .btn-glow-submit { width: 100%; height: 54px; border: none; border-radius: 16px; font-size: 1rem; font-weight: 800; color: #ffffff; background: linear-gradient(135deg, #00f2fe, #7928ca, #ff007f); cursor: pointer; box-shadow: 0 4px 20px rgba(255, 0, 127, 0.4); transition: transform 0.2s; }
        .btn-glow-submit:hover { transform: scale(1.02); }
        .result-area { display: none; margin-top: 20px; text-align: center; }
        .result-area img { width: 100%; border-radius: 18px; border: 2px solid rgba(0, 242, 254, 0.5); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .btn-download { display: inline-block; margin-top: 15px; padding: 12px 30px; background: #ffffff; color: #000000; text-decoration: none; border-radius: 14px; font-weight: 800; }
        .loading-spinner { display: none; margin-top: 15px; color: #00f2fe; text-align: center; font-weight: 600; }
    </style>
</head>
<body>
    <div class="bg-liquid-container"><div class="liquid-blob blob-1"></div><div class="liquid-blob blob-2"></div></div>
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('thumbCard', this)">🎨 FLUX 3D Studio</button>
        <button class="tab-btn" onclick="switchTab('chatCard', this)">💬 AI Assistant</button>
    </div>
    <div id="thumbCard" class="glass-card active">
        <h2>FLUX Pro 3D Thumbnail AI</h2>
        <p class="sub-text">High-Detail Metallic 3D Typography & DJ Themes</p>
        <label class="input-label">✍️ 3D Title/Text:</label>
        <input type="text" id="titleInput" class="glowing-input" placeholder="උදා: DJ NONSTOP 2026">
        <label class="input-label">🖼️ Visual Scene:</label>
        <textarea id="thumbInput" class="glowing-textarea" placeholder="උදා: Sri Lankan Leyland DJ bus, neon lights, smoke"></textarea>
        <button class="btn-glow-submit" onclick="generateFluxThumbnail()">Generate HD 3D Thumbnail ✨</button>
        <div id="thumbLoader" class="loading-spinner">⚡ FLUX AI Engine මගින් Thumbnail එක නිර්මාණය වේ... (තත්පර 10-15ක් රැඳී සිටින්න)</div>
        <div id="thumbResult" class="result-area">
            <img id="outputImage" src="" alt="Generated Thumbnail">
            <br><a href="#" id="downloadBtn" download="3d-dj-thumbnail.png" class="btn-download">Download Image 📥</a>
        </div>
    </div>
    <div id="chatCard" class="glass-card">
        <h2>Smart AI Assistant</h2>
        <textarea id="chatInput" class="glowing-textarea" placeholder="ඕනෑම දෙයක් අසන්න..."></textarea>
        <button class="btn-glow-submit" onclick="askAIAssistant()">Ask AI Assistant 🚀</button>
        <div id="chatLoader" class="loading-spinner">🤖 AI පිළිතුර සකස් කරමින්...</div>
        <div id="chatResult" class="result-area" style="text-align:left; background:rgba(2,6,23,0.9); padding:15px; border-radius:12px; border:1px solid #00f2fe;"><div id="chatResponse"></div></div>
    </div>

    <script>
        // 🔑 ඔයාගේ API Token එක පහත තැනට දාන්න (අනිත් අයට යවනකොට මෙතන හිස්ව තියන්න)
        const HF_TOKEN = "YOUR_TOKEN_HERE";

        function switchTab(cardId, btn) {
            document.querySelectorAll('.glass-card').forEach(card => card.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(cardId).classList.add('active');
            btn.classList.add('active');
        }

        async function generateFluxThumbnail() {
            const titleText = document.getElementById('titleInput').value.trim();
            const visualPrompt = document.getElementById('thumbInput').value.trim();
            const loader = document.getElementById('thumbLoader');
            const resultArea = document.getElementById('thumbResult');
            const outputImg = document.getElementById('outputImage');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!titleText && !visualPrompt) return alert("කරුණාකර විස්තරයක් ලබාදෙන්න!");
            if (HF_TOKEN === "YOUR_TOKEN_HERE") return alert("කරුණාකර Script එකේ HF_TOKEN එකට ඔයාගේ Token එක ඇතුළත් කරන්න!");

            loader.style.display = "block";
            resultArea.style.display = "none";

            let prompt = `Professional 16:9 YouTube thumbnail, 3D ultra bold metallic text '${titleText}', ${visualPrompt}, photorealistic, 8k, cinematic lighting.`;

            try {
                const response = await fetch("https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${HF_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ inputs: prompt })
                });

                if (!response.ok) throw new Error("API Limit");
                const blob = await response.blob();
                const imgObjectUrl = URL.createObjectURL(blob);
                outputImg.src = imgObjectUrl;
                downloadBtn.href = imgObjectUrl;
                loader.style.display = "none";
                resultArea.style.display = "block";
            } catch (error) {
                loader.style.display = "none";
                alert("Image එක හදන්න නොහැකි විය. කරුණාකර නැවත උත්සාහ කරන්න!");
            }
        }

        async function askAIAssistant() {
            const query = document.getElementById('chatInput').value.trim();
            if (!query) return;
            const loader = document.getElementById('chatLoader');
            const resultArea = document.getElementById('chatResult');
            loader.style.display = "block";
            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(query)}?model=openai`);
                const text = await res.text();
                loader.style.display = "none";
                resultArea.style.display = "block";
                document.getElementById('chatResponse').innerText = text;
            } catch (err) { alert("Error!"); loader.style.display = "none"; }
        }
    </script>
</body>
</html>
