<!DOCTYPE html>
<html lang="si">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Vineth AI Studio - Ultra Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap"
      rel="stylesheet">

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#020617;
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom:40px;
    overflow-x:hidden;
    position:relative;
}


/* =====================================================
   WELCOME SCREEN
===================================================== */

.welcome-screen{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(0,242,254,.18),
            rgba(121,40,202,.15),
            #020617 70%
        );

    backdrop-filter:blur(20px);

    animation:
        welcomeHide 1s ease forwards;

    animation-delay:5s;

    pointer-events:none;
}


.welcome-content{
    text-align:center;
    position:relative;
    animation:
        welcomeIn 1.2s
        cubic-bezier(.17,.67,.35,1.4)
        forwards;
}


.welcome-logo{
    width:105px;
    height:105px;

    margin:auto;
    margin-bottom:20px;

    border-radius:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:48px;

    background:
        linear-gradient(
            135deg,
            #00f2fe,
            #7928ca,
            #ff007f
        );

    box-shadow:
        0 0 20px rgba(0,242,254,.6),
        0 0 50px rgba(255,0,127,.4);

    animation:
        logoPulse 2s ease-in-out infinite;
}


.welcome-title{
    font-size:clamp(2rem,8vw,4rem);
    font-weight:800;

    background:
        linear-gradient(
            90deg,
            #00f2fe,
            #ffffff,
            #ff007f,
            #ffd700
        );

    background-size:300%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
        welcomeGradient 3s linear infinite;
}


.welcome-sub{
    margin-top:10px;
    color:#94a3b8;
    font-size:.95rem;
    letter-spacing:2px;
}


.welcome-line{
    width:220px;
    height:3px;

    margin:25px auto 0;

    border-radius:50px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00f2fe,
            #ff007f,
            transparent
        );

    animation:
        welcomeLine 2s ease-in-out infinite;
}


@keyframes welcomeIn{

    from{
        opacity:0;
        transform:scale(.6) translateY(30px);
    }

    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }

}


@keyframes welcomeHide{

    to{
        opacity:0;
        visibility:hidden;
    }

}


@keyframes logoPulse{

    0%,100%{
        transform:scale(1) rotate(0deg);
    }

    50%{
        transform:scale(1.08) rotate(3deg);
    }

}


@keyframes welcomeGradient{

    0%{
        background-position:0%;
    }

    100%{
        background-position:300%;
    }

}


@keyframes welcomeLine{

    0%,100%{
        opacity:.3;
        transform:scaleX(.5);
    }

    50%{
        opacity:1;
        transform:scaleX(1);
    }

}


/* =====================================================
   PARTICLES
===================================================== */

.particles{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
}


.particle{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#00f2fe;

    box-shadow:
        0 0 10px #00f2fe,
        0 0 20px #00f2fe;

    animation:
        particleMove linear infinite;
}


.particle:nth-child(1){
    left:8%;
    animation-duration:12s;
}

.particle:nth-child(2){
    left:18%;
    animation-duration:18s;
    animation-delay:2s;
}

.particle:nth-child(3){
    left:31%;
    animation-duration:14s;
    animation-delay:4s;
}

.particle:nth-child(4){
    left:45%;
    animation-duration:20s;
}

.particle:nth-child(5){
    left:60%;
    animation-duration:16s;
    animation-delay:3s;
}

.particle:nth-child(6){
    left:75%;
    animation-duration:13s;
}

.particle:nth-child(7){
    left:88%;
    animation-duration:19s;
    animation-delay:1s;
}


@keyframes particleMove{

    0%{
        top:110%;
        opacity:0;
        transform:scale(.5);
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:1;
    }

    100%{
        top:-10%;
        opacity:0;
        transform:scale(1.5);
    }

}


/* =====================================================
   TOP AD
===================================================== */

.top-ad-bar{

    width:100%;

    background:
        linear-gradient(
            90deg,
            rgba(15,23,42,.95),
            rgba(30,41,59,.9),
            rgba(15,23,42,.95)
        );

    border-bottom:
        1px solid rgba(0,242,254,.3);

    text-align:center;

    padding:9px 12px;

    position:relative;

    z-index:100;

    backdrop-filter:blur(15px);

    box-shadow:
        0 5px 25px rgba(0,0,0,.3);
}


.top-ad-bar a{

    color:#00f2fe;

    text-decoration:none;

    font-weight:700;

    font-size:.82rem;

    display:inline-block;

    animation:
        adGlow 2s ease-in-out infinite;
}


@keyframes adGlow{

    0%,100%{
        text-shadow:
            0 0 5px rgba(0,242,254,.3);
    }

    50%{
        text-shadow:
            0 0 15px #00f2fe;
    }

}


/* =====================================================
   LIQUID BACKGROUND
===================================================== */

.bg-liquid-container{

    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100vh;

    z-index:0;

    overflow:hidden;

    pointer-events:none;
}


.liquid-blob{

    position:absolute;

    filter:blur(85px);

    opacity:.55;

    border-radius:
        40% 60% 70% 30% /
        40% 50% 60% 70%;

    animation:
        liquidFlow 12s ease-in-out infinite alternate,
        blobRotate 25s linear infinite;
}


.blob-1{

    width:450px;
    height:450px;

    background:
        linear-gradient(
            135deg,
            #00f2fe,
            #4facfe,
            #00d2ff
        );

    top:-5%;
    left:-5%;
}


.blob-2{

    width:500px;
    height:500px;

    background:
        linear-gradient(
            135deg,
            #7928ca,
            #ff007f,
            #e100ff
        );

    bottom:-10%;
    right:-5%;

    animation-delay:-4s;
}


.blob-3{

    width:300px;
    height:300px;

    background:
        linear-gradient(
            135deg,
            #ff8c00,
            #ffd700
        );

    top:45%;
    left:35%;

    opacity:.25;

    animation-delay:-7s;
}


@keyframes liquidFlow{

    0%{
        transform:
            translate(0,0)
            scale(1);

        border-radius:
            40% 60% 70% 30% /
            40% 50% 60% 70%;
    }

    50%{
        transform:
            translate(45px,-30px)
            scale(1.1);

        border-radius:
            60% 40% 30% 70% /
            50% 60% 40% 60%;
    }

    100%{
        transform:
            translate(-30px,50px)
            scale(.95);

        border-radius:
            30% 70% 60% 40% /
            60% 40% 70% 30%;
    }

}


@keyframes blobRotate{

    from{
        rotate:0deg;
    }

    to{
        rotate:360deg;
    }

}


/* =====================================================
   TAB MENU
===================================================== */

.tab-menu{

    position:relative;
    z-index:10;

    display:flex;

    gap:12px;

    background:
        rgba(15,23,42,.68);

    backdrop-filter:
        blur(30px);

    padding:8px;

    border-radius:22px;

    border:
        1px solid rgba(255,255,255,.15);

    margin-top:20px;

    margin-bottom:20px;

    width:90%;

    max-width:450px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.5),
        inset 0 1px rgba(255,255,255,.08);

    animation:
        menuIn .8s ease;
}


@keyframes menuIn{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


.tab-btn{

    flex:1;

    padding:14px;

    border:none;

    border-radius:16px;

    background:transparent;

    color:#94a3b8;

    font-size:.9rem;

    font-weight:700;

    cursor:pointer;

    transition:.4s;

    position:relative;

    overflow:hidden;
}


.tab-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );

    transition:.6s;

}


.tab-btn:hover::before{

    left:100%;

}


.tab-btn:hover{

    color:#fff;

    transform:
        translateY(-2px);

}


.tab-btn.active{

    background:
        linear-gradient(
            135deg,
            #00f2fe,
            #7928ca,
            #ff007f
        );

    background-size:200% 200%;

    color:#fff;

    box-shadow:
        0 0 20px rgba(0,242,254,.5),
        0 0 35px rgba(255,0,127,.2);

    animation:
        activeGradient 4s ease infinite;
}


@keyframes activeGradient{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}


/* =====================================================
   GLASS CARD
===================================================== */

.glass-card{

    position:relative;

    z-index:10;

    display:none;

    width:90%;

    max-width:680px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            rgba(15,23,42,.76),
            rgba(255,255,255,.04)
        );

    backdrop-filter:
        blur(40px)
        saturate(150%);

    border:
        1px solid rgba(255,255,255,.18);

    border-radius:30px;

    padding:28px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.75),
        inset 0 1px rgba(255,255,255,.12);

    overflow:hidden;
}


.glass-card::before{

    content:"";

    position:absolute;

    top:-100%;
    left:-50%;

    width:200%;
    height:200%;

    background:
        linear-gradient(
            120deg,
            transparent 40%,
            rgba(255,255,255,.07),
            transparent 60%
        );

    transform:rotate(20deg);

    animation:
        glassShine 7s linear infinite;

    pointer-events:none;
}


@keyframes glassShine{

    from{
        transform:
            translateX(-60%)
            rotate(20deg);
    }

    to{
        transform:
            translateX(60%)
            rotate(20deg);
    }

}


.glass-card.active{

    display:block;

    animation:
        cardEnter .6s
        cubic-bezier(.17,.67,.35,1.2);
}


@keyframes cardEnter{

    from{
        opacity:0;
        transform:
            translateY(25px)
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}


/* =====================================================
   HEADINGS
===================================================== */

h2{

    font-size:1.8rem;

    font-weight:800;

    text-align:center;

    background:
        linear-gradient(
            135deg,
            #00f2fe,
            #ffffff,
            #ff007f,
            #ffd700
        );

    background-size:300%;

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:
        titleGradient 5s linear infinite;

    margin-bottom:7px;
}


@keyframes titleGradient{

    0%{
        background-position:0%;
    }

    100%{
        background-position:300%;
    }

}


.sub-text{

    text-align:center;

    color:#94a3b8;

    font-size:.86rem;

    margin-bottom:20px;

}


.input-label{

    display:block;

    font-size:.85rem;

    font-weight:700;

    color:#38bdf8;

    margin-bottom:7px;
}


/* =====================================================
   INPUTS
===================================================== */

.glowing-input,
.glowing-textarea{

    width:100%;

    background:
        rgba(2,6,23,.72);

    border:
        1px solid rgba(56,189,248,.28);

    border-radius:17px;

    padding:14px;

    color:#fff;

    font-size:.95rem;

    outline:none;

    margin-bottom:16px;

    transition:.35s;

    box-shadow:
        inset 0 1px rgba(255,255,255,.03);
}


.glowing-input:hover,
.glowing-textarea:hover{

    border-color:
        rgba(0,242,254,.6);

}


.glowing-input:focus,
.glowing-textarea:focus{

    border-color:#00f2fe;

    box-shadow:
        0 0 15px rgba(0,242,254,.25),
        inset 0 0 15px rgba(0,242,254,.04);

}


.glowing-textarea{

    height:90px;

    resize:none;

}


/* =====================================================
   UPLOAD
===================================================== */

.input-with-upload{

    display:flex;

    gap:10px;

    align-items:flex-start;

}


.plus-upload-btn{

    display:flex;

    align-items:center;

    justify-content:center;

    width:55px;
    height:50px;

    flex-shrink:0;

    background:
        linear-gradient(
            135deg,
            rgba(0,242,254,.15),
            rgba(121,40,202,.2)
        );

    border:
        1px solid rgba(56,189,248,.45);

    border-radius:16px;

    color:#00f2fe;

    font-size:1.7rem;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

    box-shadow:
        0 0 12px rgba(0,242,254,.1);
}


.plus-upload-btn:hover{

    transform:
        scale(1.08)
        rotate(3deg);

    background:
        rgba(0,242,254,.3);

    box-shadow:
        0 0 25px rgba(0,242,254,.5);

}


.preview-box{

    display:none;

    margin-bottom:15px;

    padding:8px;

    border-radius:15px;

    background:
        rgba(2,6,23,.65);

    border:
        1px solid rgba(0,242,254,.35);

    align-items:center;

    gap:10px;
}


.preview-box img{

    width:55px;
    height:55px;

    object-fit:cover;

    border-radius:10px;

}


.preview-box span{

    font-size:.75rem;

    color:#38bdf8;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =====================================================
   BUTTON
===================================================== */

.btn-glow-submit{

    width:100%;

    height:54px;

    border:none;

    border-radius:17px;

    font-size:1rem;

    font-weight:800;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #00f2fe,
            #7928ca,
            #ff007f
        );

    background-size:250% 250%;

    cursor:pointer;

    box-shadow:
        0 5px 20px rgba(255,0,127,.3);

    transition:.3s;

    animation:
        buttonGradient 5s ease infinite;

    position:relative;

    overflow:hidden;
}


.btn-glow-submit::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:60%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.4),
            transparent
        );

    transform:skewX(-20deg);

    animation:
        buttonShine 3.5s infinite;
}


@keyframes buttonGradient{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}


@keyframes buttonShine{

    0%{
        left:-100%;
    }

    50%,100%{
        left:150%;
    }

}


.btn-glow-submit:hover{

    transform:
        translateY(-3px)
        scale(1.015);

    box-shadow:
        0 0 30px rgba(0,242,254,.55),
        0 0 50px rgba(255,0,127,.25);

}


.btn-glow-submit:active{

    transform:
        scale(.97);

}


/* =====================================================
   LOADING
===================================================== */

.loading-spinner{

    display:none;

    margin-top:17px;

    color:#00f2fe;

    text-align:center;

    font-weight:600;

    animation:
        loadingPulse 1.2s infinite;
}


@keyframes loadingPulse{

    0%,100%{
        opacity:.45;
    }

    50%{
        opacity:1;
    }

}


/* =====================================================
   RESULT
===================================================== */

.result-area{

    display:none;

    margin-top:22px;

    text-align:center;
}


.result-area img{

    width:100%;

    border-radius:20px;

    border:
        2px solid rgba(0,242,254,.6);

    box-shadow:
        0 15px 40px rgba(0,0,0,.8),
        0 0 25px rgba(0,242,254,.15);

    animation:
        imagePop .7s
        cubic-bezier(.17,.67,.35,1.3);
}


@keyframes imagePop{

    from{
        opacity:0;
        transform:
            scale(.82)
            translateY(20px);
    }

    to{
        opacity:1;
        transform:
            scale(1)
            translateY(0);
    }

}


.btn-download{

    display:inline-block;

    margin-top:16px;

    padding:13px 32px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #dbeafe
        );

    color:#020617;

    text-decoration:none;

    border-radius:15px;

    font-weight:800;

    transition:.3s;

    box-shadow:
        0 5px 20px rgba(255,255,255,.12);
}


.btn-download:hover{

    transform:
        translateY(-3px)
        scale(1.05);

    box-shadow:
        0 0 25px rgba(255,255,255,.4);

}


/* =====================================================
   CHAT GLASS BOX
===================================================== */

.chat-result{

    display:none;

    margin-top:20px;

    padding:3px;

    border-radius:21px;

    background:
        linear-gradient(
            135deg,
            #00f2fe,
            #7928ca,
            #ff007f,
            #ffd700
        );

    background-size:300% 300%;

    animation:
        chatBorder 5s ease infinite;

    box-shadow:
        0 0 25px rgba(0,242,254,.15);
}


@keyframes chatBorder{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}


.chat-inner{

    min-height:100px;

    padding:20px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.09),
            rgba(2,6,23,.78)
        );

    backdrop-filter:
        blur(30px)
        saturate(180%);

    color:#fff;

    line-height:1.7;

    font-size:.94rem;

    white-space:pre-wrap;

    text-align:left;

    box-shadow:
        inset 0 1px rgba(255,255,255,.1);

    animation:
        chatAppear .5s ease;
}


@keyframes chatAppear{

    from{
        opacity:0;
        transform:
            translateY(10px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .glass-card{
        padding:20px;
        border-radius:25px;
    }

    .tab-menu{
        width:94%;
    }

    .tab-btn{
        font-size:.75rem;
        padding:12px 7px;
    }

    h2{
        font-size:1.45rem;
    }

    .welcome-title{
        font-size:2.2rem;
    }

    .welcome-logo{
        width:85px;
        height:85px;
        font-size:38px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     6 SECOND WELCOME
===================================================== -->

<div class="welcome-screen">

    <div class="welc
