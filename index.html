<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Thumbnail Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Water Flow Animation --- */
        .water-wave {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .wave-blob {
            position: absolute;
            filter: blur(90px);
            opacity: 0.45;
            border-radius: 50%;
            animation: waterFlow 14s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%);
            top: -10%;
            left: -10%;
        }

        .blob-2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #818cf8 0%, #4f46e5 100%);
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #c084fc 0%, #9333ea 100%);
            top: 40%;
            left: 40%;
            animation-delay: -9s;
        }

        @keyframes waterFlow {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(60px, -80px) scale(1.1) rotate(120deg); }
            66% { transform: translate(-50px, 60px) scale(0.95) rotate(240deg); }
            100% { transform: translate(40px, 30px) scale(1.05) rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 650px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #e0f2fe 0%, #38bdf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .ad-space {
            width: 100%;
            height: 80px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            color: #f8fafc;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }

        .btn-generate {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.35);
        }

        .btn-generate:hover {
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }

        .loading {
            display: none;
            margin-top: 25px;
            color: #38bdf8;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .result-box {
            display: none;
            margin-top: 25px;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box img {
            width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .btn-download {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            background: #ffffff;
            color: #0b0f19;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="water-wave">
        <div class="wave-blob blob-1"></div>
        <div class="wave-blob blob-2"></div>
        <div class="wave-blob blob-3"></div>
    </div>

    <div class="container">
        <h1>Gemini AI Thumbnail Studio</h1>
        <p class="subtitle">Create Ultra-HD YouTube Thumbnails Instantly</p>

        <div class="ad-space">
            [ Advertisement Banner Space ]
        </div>

        <textarea id="userPrompt" placeholder="Thumbnail එකට අවශ්‍ය විස්තරය ඇතුළත් කරන්න... (e.g. Cinematic gaming thumbnail, neon light effect, highly detailed)"></textarea>

        <button class="btn-generate" onclick="generateThumbnail()">Generate Thumbnail ✨</button>

        <div class="loading" id="loader">
            🌊 Water AI Process වෙනවා... කරුණාකර තත්පර කිහිපයක් රැඳී සිටින්න...
        </div>

        <div class="result-box" id="resultArea">
            <img id="outputImg" src="" alt="AI Thumbnail">
            <br>
            <a href="#" id="downloadBtn" download="ai-thumbnail.png" class="btn-download">Download Image 📥</a>
        </div>
    </div>

    <script>
        function generateThumbnail() {
            const prompt = document.getElementById('userPrompt').value;
            const loader = document.getElementById('loader');
            const resultArea = document.getElementById('resultArea');
            const outputImg = document.getElementById('outputImg');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!prompt) {
                alert("කරුණාකර Thumbnail එක සෑදීමට Text එකක් ඇතුළත් කරන්න!");
                return;
            }

            loader.style.display = 'block';
            resultArea.style.display = 'none';

            const randomSeed = Math.floor(Math.random() * 999999);
            const formattedPrompt = encodeURIComponent("youtube thumbnail, 8k, highly detailed, " + prompt);
            const aiUrl = `https://image.pollinations.ai/prompt/${formattedPrompt}?width=1280&height=720&nologo=true&seed=${randomSeed}`;

            outputImg.src = aiUrl;
            outputImg.onload = function() {
                loader.style.display = 'none';
                resultArea.style.display = 'block';
                downloadBtn.href = aiUrl;
            };
        }
    </script>
</body>
</html>
