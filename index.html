<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>Vineth AI Studio</title>
    <!-- CSS එහෙමම තියන්න (මම වෙනස් කළේ නැහැ) -->
    <style>
        body { background:#020617; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; padding:20px; }
        .glass-card { width:90%; max-width:500px; background:rgba(255,255,255,0.1); padding:20px; border-radius:20px; margin-top:20px; }
        .settings-box { border-bottom:1px solid #444; margin-bottom:20px; padding-bottom:10px; }
        input, textarea { width:100%; padding:10px; margin:5px 0; border-radius:10px; border:none; background:#1e293b; color:white; }
        button { width:100%; padding:12px; background:linear-gradient(90deg, #00f2fe, #7928ca); border:none; border-radius:10px; color:white; font-weight:bold; cursor:pointer; margin-top:10px;}
    </style>
</head>
<body>

<div class="glass-card">
    <!-- API Settings Section -->
    <div class="settings-box">
        <h3>⚙️ API Settings</h3>
        <input type="text" id="tokenInput" placeholder="HuggingFace Token එක මෙතන ගහන්න">
        <button onclick="saveToken()" style="background:#334155;">Token එක Save කරන්න</button>
    </div>

    <!-- Generator Section -->
    <h2>AI Thumbnail Generator</h2>
    <input type="text" id="titleInput" placeholder="Title/Text">
    <textarea id="thumbInput" placeholder="Scene description"></textarea>
    <button onclick="generateFluxThumbnail()">Generate Image</button>
    
    <div id="loader" style="display:none; margin-top:10px;">⚡ Generating...</div>
    <div id="result" style="display:none; margin-top:20px;">
        <img id="outputImage" style="width:100%; border-radius:10px;">
    </div>
</div>

<script>
    // Token එක Load කරගන්න
    document.getElementById('tokenInput').value = localStorage.getItem('hf_token') || "";

    function saveToken() {
        const token = document.getElementById('tokenInput').value;
        localStorage.setItem('hf_token', token);
        alert("Token එක Save කළා!");
    }

    async function generateFluxThumbnail() {
        const token = localStorage.getItem('hf_token');
        if(!token) return alert("කරුණාකර API Settings වලට ගිහින් Token එකක් ඇතුළත් කරන්න!");

        const title = document.getElementById('titleInput').value;
        const scene = document.getElementById('thumbInput').value;
        const loader = document.getElementById('loader');
        const img = document.getElementById('outputImage');

        loader.style.display = "block";

        const promptText = `${title} ${scene}, high quality, 3d render`;
        
        try {
            const response = await fetch("https://router.huggingface.co/hf-inference/v1/models/black-forest-labs/FLUX.1-schnell", {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${token}`, // මෙතනදී ටෝකන් එක එන්නේ Browser එකෙන්
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({ inputs: promptText })
            });

            if(!response.ok) throw new Error("API Error");

            const blob = await response.blob();
            img.src = URL.createObjectURL(blob);
            loader.style.display = "none";
            document.getElementById('result').style.display = "block";
        } catch(e) {
            alert("Error! Token එක හරියටම චෙක් කරන්න.");
            loader.style.display = "none";
        }
    }
</script>
</body>
</html>
