<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vineth AI Studio - Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #020617; color: #ffffff; min-height: 100vh; animation: fadeInBody 1s ease; }
        @keyframes fadeInBody { from { opacity: 0; } to { opacity: 1; } }
        
        /* Banner Ad */
        .ad-banner { width: 100%; background: #000; padding: 10px; text-align: center; border-bottom: 2px solid #ff007f; }
        .ad-banner a { color: #fff; font-size: 0.8rem; text-decoration: none; }

        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* Background */
        .bg-liquid-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; pointer-events: none; }
        .liquid-blob { position: absolute; filter: blur(80px); opacity: 0.4; border-radius: 50%; animation: liquidFlow 12s infinite alternate; }
        .blob-1 { width: 400px; height: 400px; background: #00f2fe; top: -10%; left: -10%; }
        .blob-2 { width: 400px; height: 400px; background: #ff007f; bottom: -10%; right: -10%; }
        @keyframes liquidFlow { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }

        .glass-card { width: 100%; max-width: 600px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border-radius: 25px; padding: 25px; border: 1px solid rgba(255, 255, 255, 0.1); margin-top: 20px; }
        
        /* Input Area */
        .input-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .glowing-input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid #38bdf8; border-radius: 12px; padding: 12px; color: white; }
        .file-upload-btn { width: 50px; height: 50px; background: #7928ca; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; font-weight: bold; color: white; transition: 0.3s; }
        .file-upload-btn:hover { background: #ff007f; }

        .btn-glow { width: 100%; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(90deg, #00f2fe, #7928ca); color: white; font-weight: 800; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .btn-glow:hover { transform: scale(1.02); box-shadow: 0 0 20px #00f2fe; }

        .result-img { width: 100%; border-radius: 20px; display: none; margin-top: 20px; animation: slideIn 0.8s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Banner Ad -->
    <div class="ad-banner">
        <a href="https://www.effectivecpmnetwork.com/wxfnq4wq2j?key=66e25978eb21df681c2911918ba91681" target="_blank">⚡ විශේෂ දැන්වීම: මෙම සේවාව නොමිලේ ලබාගන්න</a>
    </div>

    <div class="bg-liquid-container">
        <div class="liquid-blob blob-1"></div>
        <div class="liquid-blob blob-2"></div>
    </div>

    <div class="container">
        <div class="glass-card">
            <h2 style="text-align:center; margin-bottom:15px; color:#fff;">✨ Vineth AI Studio</h2>
            
            <label style="color:#38bdf8; font-weight:bold;">✍️ 3D Title/Text:</label>
            <input type="text" id="titleInput" class="glowing-input" placeholder="Text here...">
            
            <label style="color:#38bdf8; font-weight:bold; display:block; margin-top:10px;">🖼️ Scene Description:</label>
            <div class="input-group">
                <textarea id="thumbInput" class="glowing-input" style="height:60px;" placeholder="Describe your image..."></textarea>
                <input type="file" id="imageInput" style="display:none;" accept="image/*">
                <label for="imageInput" class="file-upload-btn">+</label>
            </div>

            <button class="btn-glow" onclick="runProcess()">Generate Image 🚀</button>
            <div id="loader" style="display:none; text-align:center; margin-top:10px;">කරුණාකර රැඳී සිටින්න...</div>
            <img id="resultImg" class="result-img" src="" alt="Result">
        </div>
    </div>

    <script>
        const HF_TOKEN = "Hf_uXnWsJDfgGHfcjXewjSqhcQiIfUIJMuxUK";

        // Ad Trigger
        function triggerAd() {
            window.open("https://www.effectivecpmnetwork.com/wxfnq4wq2j?key=66e25978eb21df681c2911918ba91681", "_blank");
        }

        async function runProcess() {
            // පළමුවෙන්ම ඇඩ් එක පෙන්වන්න
            triggerAd();
            
            const title = document.getElementById('titleInput').value;
            const desc = document.getElementById('thumbInput').value;
            const loader = document.getElementById('loader');
            const img = document.getElementById('resultImg');

            if(!title) return alert("කරුණාකර Title එකක් දෙන්න!");

            loader.style.display = "block";
            
            try {
                const response = await fetch("https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${HF_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ inputs: `Professional 3D render, text '${title}', ${desc}` })
                });

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                img.src = url;
                img.style.display = "block";
                loader.style.display = "none";
            } catch(e) {
                alert("වැඩේ සිද්ධ වුණේ නැහැ. පස්සේ උත්සාහ කරන්න.");
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
