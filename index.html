<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vineth AI Studio - Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #030712; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

        /* Tabs Switcher */
        .tab-container {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 20px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 400px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 15px;
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        /* Glass Panel */
        .content-panel {
            display: none;
            width: 100%;
            max-width: 600px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 30px;
        }
        .content-panel.active { display: block; }

        /* UI Elements */
        textarea { width: 100%; height: 120px; background: #020617; border: 1px solid #1e293b; border-radius: 15px; padding: 15px; color: #fff; margin-bottom: 15px; outline: none; }
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 15px; background: linear-gradient(135deg, #7928ca, #ff007f); color: #fff; font-weight: 700; cursor: pointer; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 10px #7928ca; } 50% { box-shadow: 0 0 25px #ff007f; } 100% { box-shadow: 0 0 10px #7928ca; } }
        
        .result-area { margin-top: 20px; text-align: center; }
        img { width: 100%; border-radius: 15px; }
    </style>
</head>
<body>

    <!-- Ad Wrapper -->
    <div style="width: 100%; max-width: 600px; margin-bottom: 20px;">
        <iframe src="https://www.effectivecpmnetwork.com/wxfnq4wq2j?key=66e25978eb21df681c2911918ba91681" style="width:100%; height:60px; border:none; border-radius:10px;"></iframe>
    </div>

    <!-- Tab Switcher -->
    <div class="tab-container">
        <button class="tab-btn active" onclick="showTab('thumbTab', this)">🎨 Thumbnail</button>
        <button class="tab-btn" onclick="showTab('chatTab', this)">💬 AI Assistant</button>
    </div>

    <!-- Tab 1: Thumbnail -->
    <div id="thumbTab" class="content-panel active">
        <h2>Generate Thumbnail</h2>
        <textarea id="thumbInput" placeholder="Thumbnail එකට අවශ්‍ය විස්තරය ලියන්න..."></textarea>
        <button class="btn-action" onclick="generateThumb()">Generate Now ✨</button>
        <div id="thumbResult" class="result-area" style="display:none;">
            <img id="outputImg" src="">
        </div>
    </div>

    <!-- Tab 2: AI Chat -->
    <div id="chatTab" class="content-panel">
        <h2>AI Assistant</h2>
        <textarea id="chatInput" placeholder="ප්‍රශ්නයක් අහන්න..."></textarea>
        <button class="btn-action" onclick="askAI()">Ask AI 🚀</button>
        <div id="chatResult" class="result-area" style="color:#cbd5e1;"></div>
    </div>

    <script>
        function showTab(tabId, btn) {
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function generateThumb() {
            const prompt = document.getElementById('thumbInput').value;
            if(!prompt) return alert("කරුණාකර විස්තරයක් ලියන්න");
            
            // Image Prompt Optimization Logic
            const finalPrompt = `Ultra-HD, 8k, cinematic, Sri Lankan DJ Remix background, ${prompt}`;
            const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(finalPrompt)}?width=1280&height=720&nologo=true&seed=${Math.random()}`;
            
            const imgEl = document.getElementById('outputImg');
            imgEl.src = imgUrl;
            document.getElementById('thumbResult').style.display = 'block';
        }

        function askAI() {
            const q = document.getElementById('chatInput').value;
            const res = document.getElementById('chatResult');
            res.innerText = "🤖 AI සොයමින් පවතී... (මෙම කොටසට ඔයාගේ AI API එක සම්බන්ධ කළ හැක)";
        }
    </script>
</body>
</html>
